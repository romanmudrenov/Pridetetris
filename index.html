<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>PRIDE — Корпоративный Игровой Портал</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="./css/main.css?v=18">
<link rel="stylesheet" href="./css/music.css?v=18">
<style>
  .screen { display: none; }
  .screen.active { display: block; }
  .game-screen { display: none; }
  .game-screen.active { display: flex; }
</style>
</head>
<body>

<!-- ============ ЭКРАН 1: ПРИВЕТСТВИЕ ============ -->
<div class="screen active" id="scrWelcome">
  <div class="screen-inner center-inner">
    <svg class="big-logo" viewBox="0 0 64 64">
      <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="#ff007a" stroke-width="4" fill="#120924"/>
      <path d="M20,25 L32,14 L44,25 L39,44 L25,44 Z" stroke="#00f0ff" stroke-width="3" fill="none"/>
      <circle cx="27" cy="28" r="2.5" fill="#fcee09"/>
      <circle cx="37" cy="28" r="2.5" fill="#fcee09"/>
      <path d="M27,36 L32,39 L37,36" stroke="#fff" stroke-width="2.5" fill="none"/>
    </svg>
    <div class="welcome-badge">PRIDE // GAME PORTAL</div>
    <h1 class="hero-title">Добро пожаловать на портал PRIDE</h1>
    <p class="hero-sub">Играй, ставь рекорды, слушай музыку и общайся с коллегами. Создай свой профиль — это займёт минуту.</p>
    <button class="btn-primary" id="btnGoRegister">📝 РЕГИСТРАЦИЯ</button>
    <button class="btn-secondary" id="btnGoLogin" style="display:none;">🔑 Уже есть профиль? Войти</button>
  </div>
</div>

<!-- ============ ЭКРАН 2: РЕГИСТРАЦИЯ / РЕДАКТИРОВАНИЕ ПРОФИЛЯ ============ -->
<div class="screen" id="scrForm">
  <div class="screen-inner">
    <button class="back-btn" id="btnFormBack">← Назад</button>
    <h2 class="screen-title" id="formTitle">Регистрация</h2>

    <div class="sec-title">1. Ник</div>
    <input type="text" id="fNick" class="inp" maxlength="20" placeholder="Например: Лев Прайдов" autocomplete="off">

    <div class="sec-title">2. Отдел</div>
    <select id="fDept" class="inp"></select>

    <div class="sec-title">3. Аватар</div>
    <div class="avatar-creator">
      <div class="avatar-big-preview" id="fAvatarPreview">🦁</div>
      <div class="animal-grid" id="fAnimalGrid"></div>
      <div class="color-row" id="fColorRow"></div>
    </div>

    <div class="sec-title" id="fPassTitle">4. Пароль</div>
    <input type="password" id="fPass" class="inp" placeholder="Пароль (минимум 4 символа)" autocomplete="new-password">
    <input type="password" id="fPass2" class="inp" placeholder="Повтори пароль" autocomplete="new-password">

    <div class="sec-title">5. Цветовая схема</div>
    <div class="theme-grid" id="themeGrid"></div>

    <div class="form-error" id="formError"></div>
    <button class="btn-primary" id="btnFormSubmit">✅ СОЗДАТЬ ПРОФИЛЬ</button>
  </div>
</div>

<!-- ============ ЭКРАН 3: ВХОД ============ -->
<div class="screen" id="scrLogin">
  <div class="screen-inner">
    <button class="back-btn" data-go="scrWelcome">← Назад</button>
    <h2 class="screen-title">Вход</h2>
    <div class="sec-title">Ник</div>
    <input type="text" id="lNick" class="inp" maxlength="20" placeholder="Твой ник" autocomplete="username">
    <div class="sec-title">Пароль</div>
    <input type="password" id="lPass" class="inp" placeholder="Пароль" autocomplete="current-password">
    <div class="form-error" id="loginError"></div>
    <button class="btn-primary" id="btnLoginSubmit">🔑 ВОЙТИ</button>
  </div>
</div>

<!-- ============ ЭКРАН 4: ГЛАВНОЕ МЕНЮ ============ -->
<div class="screen" id="scrMain">
  <div class="screen-inner">
    <div class="profile-card">
      <div class="avatar-big" id="mainAvatar">🦁</div>
      <div class="pc-info">
        <div class="pc-name" id="mainName">Игрок</div>
        <div class="pc-dept" id="mainDept"></div>
        <div class="pc-best" id="mainBest"></div>
      </div>
      <button class="pc-edit" id="btnEditProfile" title="Редактировать профиль">✏️</button>
    </div>

    <div class="menu-list">
      <button class="menu-item" data-go="scrMusic">
        <span class="mi-ico">🎵</span>
        <span class="mi-txt"><b>Музыка и Радио</b><i>Плеер, интернет-радио и настройка звука</i></span>
        <span class="mi-arr">›</span>
      </button>
      <button class="menu-item" data-go="scrGames">
        <span class="mi-ico">🎮</span>
        <span class="mi-txt"><b>Игры</b><i>PRIDE Tetris и другие</i></span>
        <span class="mi-arr">›</span>
      </button>
      <button class="menu-item" data-go="scrLeaders">
        <span class="mi-ico">🏆</span>
        <span class="mi-txt"><b>Таблица лидеров</b><i>Лучшие результаты</i></span>
        <span class="mi-arr">›</span>
      </button>
      <button class="menu-item" data-go="scrChat">
        <span class="mi-ico">💬</span>
        <span class="mi-txt
